<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiddis | Admin Control Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">Tiddis Admin</div>
        <nav class="nav-links">
            <a href="index.html">View Store</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="admin-wrapper">
            <h1 class="admin-title">Store Administration Panel</h1>
            
            <!-- External Database & Sheets Connections Config -->
            <div style="margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid var(--border-color);">
                <h3 style="font-size: 18px; font-weight: 500; margin-bottom: 20px;">Integrations & Database Connections</h3>
                <div class="form-group">
                    <label for="imgdb-select">Image Database Provider (ImgBB / Custom DB)</label>
                    <select id="imgdb-select">
                        <option value="imgbb">ImgBB API</option>
                        <option value="custom">Custom Image Database URL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="google-sheets-url">Google Sheets Webhook / Connection URL</label>
                    <input type="text" id="google-sheets-url" placeholder="Paste your Google Sheets deployment URL here...">
                </div>
            </div>

            <!-- Product Management Form -->
            <h3 style="font-size: 18px; font-weight: 500; margin-bottom: 20px;">Add New Rug (KSOR Collection)</h3>
            <form id="product-form">
                <div class="form-group">
                    <label for="product-name">Product Name / Title</label>
                    <input type="text" id="product-name" value="KSOR Classic" required>
                </div>
                <div class="form-group">
                    <label for="product-size">Size</label>
                    <input type="text" id="product-size" value="200x280 cm" required>
                </div>
                <div class="form-group">
                    <label for="product-price">Price (DZD)</label>
                    <input type="number" id="product-price" value="12500" required>
                </div>
                <div class="form-group">
                    <label for="product-img">Direct Image URL</label>
                    <input type="url" id="product-img" placeholder="https://i.ibb.co/..." required>
                </div>
                <button type="submit" class="admin-submit-btn">Save Product to Database</button>
            </form>
        </div>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
