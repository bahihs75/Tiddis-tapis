<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiddis | Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">Tiddis <span style="font-size: 1rem; color: var(--text-muted); font-weight: normal; letter-spacing: 0;">/ Admin Panel</span></div>
        <nav>
            <a href="index.html" style="text-decoration: none; color: var(--text-primary); font-weight: 600;">Back to Store</a>
        </nav>
    </header>

    <main class="admin-container">
        <section class="collection-intro">
            <h2>Store Management</h2>
        </section>

        <!-- Connections Section: Google Sheets & Image DB -->
        <div class="admin-card">
            <h3>External Connections</h3>
            <div class="form-group">
                <label for="google-sheet-url">Google Sheets Web App URL (For Orders)</label>
                <input type="text" id="google-sheet-url" class="form-input" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            <div class="form-group">
                <label for="imgbb-api-key">Image DB API Key (ImgBB / Others)</label>
                <input type="password" id="imgbb-api-key" class="form-input" placeholder="Enter API Key">
            </div>
            <button id="save-settings-btn" class="btn-primary">Save Connections</button>
        </div>

        <!-- Add Product Section -->
        <div class="admin-card">
            <h3>Add New Product</h3>
            <form id="add-product-form">
                <div class="form-group">
                    <label for="prod-title">Product Name / Title</label>
                    <input type="text" id="prod-title" class="form-input" placeholder="e.g., KSOR Classic" required>
                </div>
                
                <div class="form-group">
                    <label for="prod-collection">Collection</label>
                    <input type="text" id="prod-collection" class="form-input" value="KSOR" required>
                </div>

                <div class="form-group">
                    <label for="prod-price">Base Price (DZD)</label>
                    <input type="number" id="prod-price" class="form-input" placeholder="12500" required>
                </div>

                <div class="form-group">
                    <label for="prod-image">Default Image URL</label>
                    <input type="text" id="prod-image" class="form-input" placeholder="Paste direct image link here" required>
                </div>
                
                <h4 style="margin: 24px 0 16px; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Product Variants (Sizes & Colors)</h4>
                
                <div id="variants-container">
                    <!-- Variant input rows will be dynamically injected here -->
                </div>
                
                <button type="button" id="add-variant-btn" class="btn-primary" style="background: #f5f5f5; color: var(--text-primary); border: 1px solid var(--border-color); margin-bottom: 24px;">+ Add Variant</button>
                
                <button type="submit" class="btn-primary" style="width: 100%;">Save Product to Database</button>
            </form>
        </div>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
