<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>TIDDIS TAPIS | Product Details</title>
    <link rel="stylesheet" href="css/style.css?v=20260827-ux5">
    <link rel="stylesheet" href="css/tiddis-design-system.css?v=20260827-ux5">
    <!-- مكتبات PDF -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* تحسينات تخطيط صفحة المنتج المستوحاة من القالب */
        .product-detail-layout {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 24px;
            margin-bottom: 40px;
            align-items: start;
        }

        .main-viewer {
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .thumbnails-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .thumb-item {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            background: #fff;
            transition: all 0.2s ease;
        }

        .thumb-item.active {
            border-color: var(--primary-color);
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info-glass-box {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 32px;
            margin-top: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .info-item label {
            display: block;
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-item span, .info-item select {
            font-family: var(--font-serif);
            font-size: 16px;
            color: var(--text-color);
        }

        .price-tag-large {
            font-size: 28px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 24px;
            display: block;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
        }

        @media (max-width: 900px) {
            .product-detail-layout {
                grid-template-columns: 1fr;
            }
            .thumbnails-sidebar {
                flex-direction: row;
                order: 2;
                max-height: none;
                overflow-x: auto;
            }
            .thumb-item {
                width: 80px;
                flex-shrink: 0;
            }
            .main-viewer {
                order: 1;
            }
        }

        /* ============================================
           Product page — fixed luxury workspace
           ============================================ */
        .product-page {
            overflow: hidden;
        }

        .product-page-main {
            height: 100svh;
            min-height: 0;
            padding: var(--tiddis-header-height) clamp(18px, 3vw, 48px) 18px;
            overflow: hidden;
        }

        .product-page-main #product-detail-container {
            height: calc(100% - var(--tiddis-header-height) - 18px);
            min-height: 0;
        }

        .product-detail-layout {
            display: grid;
            grid-template-columns: 58px minmax(0, 1.35fr) minmax(330px, .78fr);
            gap: clamp(14px, 2vw, 30px);
            height: 100%;
            min-height: 0;
            margin: 0;
            align-items: stretch;
        }

        .product-back-rail {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-width: 0;
            padding-top: 6px;
            color: var(--accent);
            text-decoration: none;
        }

        .product-back-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            font-family: var(--font-sans);
            font-size: 40px;
            font-weight: 300;
            line-height: 1;
            border: 1px solid transparent;
            transition: transform .25s ease, color .25s ease, border-color .25s ease;
        }

        .product-back-label {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .product-back-rail:hover .product-back-icon,
        .product-back-rail:focus-visible .product-back-icon {
            color: var(--accent-hover);
            border-color: var(--border-color);
            transform: translateX(-5px);
        }

        .product-gallery-shell {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 82px;
            gap: 14px;
            min-width: 0;
            min-height: 0;
            height: 100%;
        }

        .product-page .main-viewer {
            width: 100%;
            height: 100%;
            min-height: 0;
            aspect-ratio: auto;
            border: 1px solid var(--border-color);
            border-radius: 0;
            background: rgba(255, 255, 255, .24);
            box-shadow: 0 20px 60px rgba(25, 24, 22, .08);
        }

        .product-page .main-viewer img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            object-fit: contain;
        }

        .product-page .thumbnails-sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            max-height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 4px 0 0;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

        .product-page .thumb-item {
            flex: 0 0 74px;
            width: 74px;
            height: 74px;
            aspect-ratio: auto;
            border-radius: 0;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, .4);
        }

        .product-page .thumb-item.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(84, 42, 48, .12);
        }

        .product-page .thumb-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-page .product-info-glass-box {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            height: 100%;
            margin: 0;
            padding: clamp(24px, 3vw, 46px);
            overflow-y: auto;
            border-radius: 0;
            border: 1px solid rgba(255, 255, 255, .7);
            background: rgba(255, 255, 255, .56);
            box-shadow: 0 22px 60px rgba(25, 24, 22, .08);
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }

        .product-info-heading h1 {
            margin: 0 0 8px;
            font-family: var(--font-serif);
            font-size: clamp(30px, 3.2vw, 54px);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 1px;
        }

        .product-info-heading .price-tag-large {
            margin: 0;
            font-size: clamp(22px, 2vw, 32px);
        }

        .product-page .info-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 24px;
            margin: clamp(28px, 4vh, 54px) 0 28px;
        }

        .product-page .info-item {
            min-width: 0;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .product-page .info-item span,
        .product-page .info-item select {
            display: block;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .product-detail-description {
            margin-top: 8px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
        }

        .product-detail-description label {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .product-detail-description p {
            margin: 8px 0 0;
            line-height: 1.65;
        }

        .product-page .action-buttons {
            margin-top: auto;
            padding-top: 28px;
            gap: 10px;
        }

        .product-page .action-buttons button {
            min-height: 48px;
        }

        .product-page .main-footer {
            display: none;
        }

        @media (max-width: 900px) {
            .product-page {
                overflow: visible;
            }

            .product-page-main {
                height: auto;
                min-height: 100svh;
                padding: calc(var(--tiddis-header-height) + 16px) 16px 16px;
                overflow: visible;
            }

            .product-page-main #product-detail-container {
                height: auto;
            }

            .product-detail-layout {
                grid-template-columns: 1fr;
                height: auto;
                gap: 16px;
            }

            .product-back-rail {
                position: relative;
                inset: auto;
                z-index: 2;
                grid-row: 1;
                width: 100%;
                min-height: 52px;
                align-items: center;
                justify-content: flex-start;
                padding: 0 2px;
                margin: 0;
            }

            .product-back-icon {
                width: 48px;
                height: 48px;
                font-size: 38px;
                border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
                background: color-mix(in srgb, var(--bg-color) 68%, transparent);
                box-shadow: 0 10px 26px rgba(0, 0, 0, .08), inset 0 1px 0 rgba(255,255,255,.56);
                backdrop-filter: blur(14px) saturate(1.15);
                -webkit-backdrop-filter: blur(14px) saturate(1.15);
            }

            .product-gallery-shell {
                grid-row: 2;
            }

            .product-info-glass-box {
                grid-row: 3;
            }

            .product-gallery-shell {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(360px, 58svh) auto;
                height: auto;
            }

            .product-page .thumbnails-sidebar {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 0 0 4px;
            }

            .product-page .thumb-item {
                flex-basis: 70px;
                width: 70px;
                height: 70px;
            }

            .product-page .main-viewer {
                height: 100%;
            }

            .product-page .product-info-glass-box {
                height: auto;
                max-height: none;
                overflow: visible;
                padding: 24px;
            }

            .product-page .action-buttons {
                margin-top: 28px;
            }

            .product-page .main-footer {
                display: block;
            }
        }

        @media (max-width: 520px) {
            .product-page .info-grid {
                grid-template-columns: 1fr;
            }

            .product-page .action-buttons {
                flex-direction: column;
            }

            .product-page .action-buttons button {
                width: 100%;
            }
        }
        /* ============================================
           Premium Technical Sheet — Editorial Luxury
           Rendered off-screen for A4 PDF export
           ============================================ */
        .technical-sheet-stage {
            position: fixed;
            left: -10000px;
            top: 0;
            width: 794px;
            pointer-events: none;
            z-index: -1;
        }

        .technical-sheet-canvas {
            box-sizing: border-box;
            width: 794px;
            padding: 48px 52px 36px;
            background: #f7f4ee;
            color: #28231f;
            font-family: var(--font-sans), 'Helvetica Neue', sans-serif;
            line-height: 1.4;
        }

        .technical-sheet-canvas * {
            box-sizing: border-box;
        }

        .sheet-header,
        .sheet-footer,
        .sheet-facts,
        .sheet-hero,
        .sheet-section-heading,
        .sheet-document-meta,
        .sheet-price-block,
        .sheet-contact-block,
        .sheet-footer-note {
            display: flex;
        }

        .sheet-header {
            align-items: flex-start;
            justify-content: space-between;
            padding-bottom: 22px;
            border-bottom: 1px solid rgba(40, 35, 31, .18);
        }

        .sheet-wordmark {
            display: flex;
            align-items: baseline;
            gap: 9px;
            color: #28231f;
            font-family: var(--font-serif), Georgia, serif;
            font-size: 25px;
            letter-spacing: 4px;
            line-height: 1;
        }

        .sheet-wordmark small {
            color: #6d2830;
            font-family: var(--font-mono), monospace;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .sheet-logo-image {
            display: block;
            width: auto;
            max-width: 190px;
            height: 42px;
            object-fit: contain;
            object-position: left center;
        }

        .sheet-document-meta {
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
            color: #716a63;
            font-family: var(--font-mono), monospace;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-align: right;
        }

        .sheet-document-meta strong {
            color: #6d2830;
            font-weight: 500;
        }

        .sheet-hero {
            min-height: 310px;
            gap: 28px;
            padding: 30px 0 26px;
        }

        .sheet-hero-image {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 420px;
            height: 310px;
            overflow: hidden;
            background: #e7e0d5;
        }

        .sheet-hero-image img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            padding: 0;
            object-fit: contain;
            object-position: center;
            background: transparent;
        }

        .sheet-image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #716a63;
            font-family: var(--font-mono), monospace;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .sheet-image-index {
            position: absolute;
            right: 13px;
            bottom: 11px;
            padding: 5px 7px;
            color: #f7f4ee;
            background: rgba(40, 35, 31, .68);
            font-family: var(--font-mono), monospace;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .sheet-hero-copy {
            display: flex;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .sheet-kicker,
        .sheet-price-block span,
        .sheet-facts span,
        .sheet-spec-row span,
        .sheet-footer,
        .sheet-section-heading span {
            color: #827970;
            font-family: var(--font-mono), monospace;
            font-size: 9px;
            letter-spacing: 1.3px;
            text-transform: uppercase;
        }

        .sheet-hero-copy h1 {
            margin: 16px 0 7px;
            color: #28231f;
            font-family: var(--font-serif), Georgia, serif;
            font-size: 38px;
            font-weight: 400;
            letter-spacing: -.5px;
            line-height: 1.04;
        }

        .sheet-hero-category {
            margin: 0;
            color: #6d2830;
            font-family: var(--font-mono), monospace;
            font-size: 10px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .sheet-price-block {
            flex-direction: column;
            gap: 5px;
            margin: 28px 0 17px;
            padding: 13px 0 15px;
            border-top: 1px solid rgba(40, 35, 31, .18);
            border-bottom: 1px solid rgba(40, 35, 31, .18);
        }

        .sheet-price-block strong {
            color: #6d2830;
            font-family: var(--font-serif), Georgia, serif;
            font-size: 25px;
            font-weight: 400;
        }

        .sheet-price-block small {
            font-family: var(--font-mono), monospace;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .sheet-intro,
        .sheet-description p {
            margin: 0;
            color: #716a63;
            font-family: var(--font-serif), Georgia, serif;
            font-size: 13px;
            line-height: 1.65;
        }

        .sheet-facts {
            border-top: 1px solid rgba(40, 35, 31, .18);
            border-bottom: 1px solid rgba(40, 35, 31, .18);
        }

        .sheet-facts > div {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 7px;
            min-height: 58px;
            padding: 12px 14px 11px 0;
            border-right: 1px solid rgba(40, 35, 31, .14);
        }

        .sheet-facts > div + div {
            padding-left: 14px;
        }

        .sheet-facts > div:last-child {
            border-right: 0;
        }

        .sheet-facts strong {
            overflow-wrap: anywhere;
            color: #28231f;
            font-family: var(--font-serif), Georgia, serif;
            font-size: 13px;
            font-weight: 400;
        }

        .sheet-details,
        .sheet-description,
        .sheet-variants {
            padding-top: 24px;
        }

        .sheet-section-heading {
            align-items: baseline;
            gap: 12px;
            margin-bottom: 12px;
        }

        .sheet-section-heading span {
            color: #6d2830;
        }

        .sheet-section-heading h2 {
            margin: 0;
            color: #28231f;
            font-family: var(--font-serif), Georgia, serif;
            font-size: 19px;
            font-weight: 400;
        }

        .sheet-spec-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 28px;
            border-top: 1px solid rgba(40, 35, 31, .18);
        }

        .sheet-spec-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            min-height: 35px;
            padding: 9px 0 8px;
            border-bottom: 1px solid rgba(40, 35, 31, .12);
        }

        .sheet-spec-row strong {
            max-width: 65%;
            overflow-wrap: anywhere;
            color: #28231f;
            font-family: var(--font-serif), Georgia, serif;
            font-size: 12px;
            font-weight: 400;
            text-align: right;
        }

        .sheet-description p {
            padding: 13px 0 0;
            border-top: 1px solid rgba(40, 35, 31, .18);
        }

        .sheet-variants table {
            width: 100%;
            border-collapse: collapse;
            border-top: 1px solid rgba(40, 35, 31, .18);
            font-family: var(--font-serif), Georgia, serif;
            font-size: 12px;
        }

        .sheet-variants th,
        .sheet-variants td {
            padding: 8px 10px 8px 0;
            border-bottom: 1px solid rgba(40, 35, 31, .12);
            text-align: left;
        }

        .sheet-variants th {
            color: #827970;
            font-family: var(--font-mono), monospace;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sheet-footer {
            position: relative;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid rgba(40, 35, 31, .18);
        }

        .sheet-qr-block,
        .sheet-contact-block,
        .sheet-footer-note {
            display: flex;
            flex-direction: column;
        }

        .sheet-qr-block {
            align-items: flex-start;
            gap: 6px;
        }

        .sheet-qr-block #qrcode-container {
            padding: 5px;
            background: #fff;
        }

        .sheet-qr-block #qrcode-container img,
        .sheet-qr-block #qrcode-container canvas {
            display: block;
        }

        .sheet-qr-block span,
        .sheet-contact-block span,
        .sheet-footer-note span {
            color: #827970;
            font-family: var(--font-mono), monospace;
            font-size: 8px;
            letter-spacing: .5px;
        }

        .sheet-contact-block {
            align-items: flex-end;
            gap: 4px;
            color: #28231f;
            text-align: right;
        }

        .sheet-contact-block strong {
            margin-bottom: 2px;
            color: #6d2830;
            font-family: var(--font-mono), monospace;
            font-size: 9px;
            letter-spacing: 1px;
        }

        .sheet-footer-note {
            align-items: flex-end;
            gap: 4px;
            text-align: right;
        }

    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body class="product-page">

    <!-- الهيدر الثابت: العلامة تبقى ظاهرة، والزر يفتح القائمة الجانبية -->
    <header class="desktop-header" id="desktop-header">
        <button class="hamburger header-hamburger" id="header-hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <a class="header-brand" href="/" aria-label="Tiddis Tapis home">
            <span class="brand-lockup">
                <img id="header-logo" class="header-logo-image" src="tiddis-logo.svg" alt="TIDDIS TAPIS">
                <span class="brand-wordmark-fallback" aria-hidden="true">
                    <span class="brand-main">TIDDIS</span><span class="brand-sub">TAPIS</span>
                </span>
            </span>
        </a>
    </header>

    <!-- Floating opener kept only for backward-compatible JS, hidden by CSS -->
    <button class="hamburger floating-hamburger" id="floating-hamburger-btn" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <button class="mobile-menu-close" id="mobile-menu-close" aria-label="Close menu">✕</button>
        <div class="logo-container">
            <div class="logo-wrapper" aria-hidden="true">
                <img id="sidebar-logo" class="sidebar-logo-image" src="" alt="">
            </div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
            <a href="/#products-grid" class="back-to-store">← Back to Store</a>
        </div>
    </div>

    <!-- رأس الهاتف -->
    <div class="mobile-header">
        <a class="mobile-brand" href="/" aria-label="Tiddis Tapis home">
            <span class="brand-lockup">
                <img id="mobile-logo" class="mobile-header-logo-image" src="tiddis-logo.svg" alt="TIDDIS TAPIS">
