<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>TIDDIS TAPIS | Product Details</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- مكتبات PDF -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* تحسينات تخطيط صفحة المنتج المستوحاة من القالب */
        .product-detail-layout {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 24px;
            margin-bottom: 40px;
            align-items: start;
        }

        .main-viewer {
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .thumbnails-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .thumb-item {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            background: #fff;
            transition: all 0.2s ease;
        }

        .thumb-item.active {
            border-color: var(--primary-color);
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info-glass-box {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 32px;
            margin-top: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .info-item label {
            display: block;
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .info-item span, .info-item select {
            font-family: var(--font-serif);
            font-size: 16px;
            color: var(--text-color);
        }

        .price-tag-large {
            font-size: 28px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 24px;
            display: block;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
        }

        @media (max-width: 900px) {
            .product-detail-layout {
                grid-template-columns: 1fr;
            }
            .thumbnails-sidebar {
                flex-direction: row;
                order: 2;
                max-height: none;
                overflow-x: auto;
            }
            .thumb-item {
                width: 80px;
                flex-shrink: 0;
            }
            .main-viewer {
                order: 1;
            }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <button class="mobile-menu-close" id="mobile-menu-close" aria-label="Close menu">✕</button>
        <div class="logo-container">
            <div class="logo-wrapper">
                <img id="sidebar-logo" src="" alt="TIDDIS Logo" style="display:none; max-height:32px; margin-right:10px; background:transparent;">
                <div>
                    <div class="brand-main">TIDDIS</div>
                    <div class="brand-sub">TAPIS</div>
                </div>
            </div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
            <a href="index.html" class="back-to-store">← Back to Store</a>
        </div>
    </div>

    <!-- رأس الهاتف -->
    <div class="mobile-header">
        <div class="mobile-brand">
            <div class="logo-wrapper" style="display:flex; align-items:center;">
                <img id="mobile-logo" src="" alt="TIDDIS Logo" style="display:none; max-height:24px; margin-right:8px; background:transparent;">
                <div>
                    <span class="brand-main">TIDDIS</span>
                    <span class="brand-sub">TAPIS</span>
                </div>
            </div>
        </div>
        <div class="mobile-header-actions">
            <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="main-content" id="main-content">
        <div class="back-link-container">
            <a href="index.html#products-grid" class="back-link">
                <span class="back-arrow">←</span> BACK TO PRODUCTS
            </a>
        </div>

        <div id="product-detail-container">
            <p style="text-align:center; padding:60px 20px; font-family:'Space Mono', monospace; color:#6b6b6b;">Loading product details...</p>
        </div>

        <footer class="main-footer">
            <p>&copy; 2025 TIDDIS TAPIS — All rights reserved.</p>
        </footer>
    </main>

    <!-- النوافذ المنبثقة -->
    <div id="order-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <button class="modal-close" id="modal-close">&times;</button>
            <h2>Order Details</h2>
            <form id="order-form">
                <div class="form-group">
                    <label for="customer-name">Full Name</label>
                    <input type="text" id="customer-name" placeholder="e.g., Ahmed Benali" required>
                </div>
                <div class="form-group">
                    <label for="customer-phone">Phone Number</label>
                    <input type="tel" id="customer-phone" placeholder="0559 123 456" required>
                </div>
                <div class="form-group">
                    <label for="wilaya-select">Wilaya</label>
                    <select id="wilaya-select" required>
                        <option value="">-- Select your wilaya --</option>
                    </select>
                </div>
                <div class="order-summary">
                    <div class="summary-line"><span>Subtotal:</span><span id="modal-subtotal">0 DZD</span></div>
                    <div class="summary-line"><span>Delivery Fee:</span><span id="modal-delivery">0 DZD</span></div>
                    <div class="summary-line total"><span>Total:</span><span id="modal-total">0 DZD</span></div>
                </div>
                <button type="submit" class="order-submit-btn">Confirm Order</button>
            </form>
            <div id="order-status" style="margin-top:10px; font-size:0.9rem;"></div>
        </div>
    </div>

    <div id="order-success-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box success-modal">
            <button class="modal-close" id="success-close">&times;</button>
            <div style="text-align:center; padding:10px 0;">
                <div style="font-size:48px; margin-bottom:12px;">✅</div>
                <h2 style="font-family:var(--font-serif); font-weight:400; letter-spacing:1px; margin-bottom:8px;">Order Confirmed!</h2>
                <p style="color:#6b6b6b; font-size:15px; margin-bottom:20px;">Thank you for your order. We will contact you shortly.</p>
                <button id="download-pdf-after-order" class="btn-primary" style="margin-bottom:8px;">📄 Download Technical Sheet</button>
                <br>
                <button id="close-success-modal" class="btn-secondary" style="margin-top:4px;">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module">
        import { loadProductDetail } from './js/store.js';
        loadProductDetail();
    </script>
</body>
</html>
